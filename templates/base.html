<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>{% block title %}RED//MEDIA{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="scanlines"></div>
<header class="topbar">
<a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">R</span> RED<span>//</span>MEDIA</a>
<nav><a href="{{ url_for('index') }}">EXPLORE</a><a href="{{ url_for('admin_login') }}">ADMIN</a></nav>
</header>
<main class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}<div class="messages">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>RED//MEDIA <span>— DIGITAL ARCHIVE</span></footer>
</body></html>
